# Nombre de proyecto FIJO: si se ejecuta `docker compose` desde otra carpeta
# (p. ej. INSOFT-deploy) sigue usando el mismo stack y el mismo volumen de datos.
name: insoft

# ── Endurecido para exponer con túnel (ver F5b) ──────────────────────────
# - puertos solo en 127.0.0.1: nada escucha en 0.0.0.0; el túnel (Tailscale
#   Funnel/ngrok) corre en el MISMO PC y apunta a localhost, así el único
#   acceso público es el del túnel.
# - SECRET_KEY y POSTGRES_PASSWORD sin valor débil por defecto: `docker
#   compose up` falla si el .env no las define (evita despliegues con claves
#   conocidas). IMPORTANTE: si el volumen real se inicializó con otra
#   contraseña, esta var NO cambia la existente; es la que usa la APP para
#   conectarse (ver docs/despliegue/PASO_A_PASO_STAGING.md).
# - DOCS_ENABLED=false por defecto: /docs /redoc y /openapi.json no se sirven
#   (config.py). DEV_AUTH_ENABLED=false siempre expuesto.
# - CORS: BACKEND_CORS_ORIGINS obligatorio con el origen EXACTO del frontend,
#   sin comodines de LAN (BACKEND_CORS_ORIGIN_REGEX "" por defecto).

services:
  db:
    # Imagen con la extensión pgvector incluida (necesaria para el módulo RAG/IA).
    image: pgvector/pgvector:pg16
    container_name: insoft-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oftallearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (sin valor débil en compose)}
      POSTGRES_DB: ${POSTGRES_DB:-oftallearn}
    ports:
      # Solo loopback utilitarior para psql/backups desde el propio PC;
      # el puerto del host configurable para no chocar con un PostgreSQL local.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oftallearn} -d ${POSTGRES_DB:-oftallearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        # onnx: -40% de RAM y -78% de imagen, vectores idénticos (ram #32);
        # para alternar: EMBEDDINGS_BACKEND=torch docker compose build backend.
        EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-onnx}
    container_name: insoft-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-oftallearn}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-oftallearn}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env (openssl rand -hex 32)}
      EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-onnx}
      # Documentación OpenAPI apagada por defecto cuando el backend se expone.
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Origen EXACTO del frontend (sin comodines); varios: separar por comas.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?define el/los origenes exactos del frontend, ej https://mi-app.vercel.app}
      BACKEND_CORS_ORIGIN_REGEX: ${BACKEND_CORS_ORIGIN_REGEX:-}
      TEACHER_EMAILS: ${TEACHER_EMAILS:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      # Tope de login por IP (endpoints de /api/auth/*).
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-60/hour}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_NORMALIZE_MODEL: ${OPENROUTER_NORMALIZE_MODEL:-liquid/lfm-2.5-2.6b:free}
      OPENROUTER_ANSWER_MODEL: ${OPENROUTER_ANSWER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      AI_ASK_RATE_LIMIT: ${AI_ASK_RATE_LIMIT:-60/hour}
      OPENROUTER_GLOBAL_LIMIT_PER_MIN: ${OPENROUTER_GLOBAL_LIMIT_PER_MIN:-18}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_QUESTION_RATE_LIMIT: ${AI_QUESTION_RATE_LIMIT:-5/hour}
      AI_QUESTION_MAX_ATTEMPTS: ${AI_QUESTION_MAX_ATTEMPTS:-2}
      QUIZ_MAX_QUESTIONS: ${QUIZ_MAX_QUESTIONS:-10}
      QUIZ_ANSWER_RATE_LIMIT: ${QUIZ_ANSWER_RATE_LIMIT:-120/hour}
      PRACTICE_RATE_LIMIT: ${PRACTICE_RATE_LIMIT:-30/hour}
      PRACTICE_DEFAULT_COUNT: ${PRACTICE_DEFAULT_COUNT:-5}
      PRACTICE_MAX_COUNT: ${PRACTICE_MAX_COUNT:-10}
      PRACTICE_AI_RATIO: ${PRACTICE_AI_RATIO:-0.4}
      PRACTICE_MAX_GENERATIONS_PER_SUBTOPIC_PER_DAY: ${PRACTICE_MAX_GENERATIONS_PER_SUBTOPIC_PER_DAY:-4}
    ports:
      # Solo el túnel (en el propio PC) alcanza el backend.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('PORT','8000')}/health\", timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_DEV_AUTH: ${DEV_AUTH_ENABLED:-false}
    container_name: insoft-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  # Nombre estable en Docker, independiente del proyecto/carpeta: siempre los
  # datos reales (cursos, preguntas, usuarios). No crear uno distinto.
  postgres_data:
    name: insoft_postgres_data
