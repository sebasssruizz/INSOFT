services:
  db:
    # Imagen con la extensión pgvector incluida (necesaria para el módulo RAG/IA).
    image: pgvector/pgvector:pg16
    container_name: insoft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oftallearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oftallearn}
      POSTGRES_DB: ${POSTGRES_DB:-oftallearn}
    ports:
      # Puerto del host configurable para no chocar con un PostgreSQL local
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oftallearn} -d ${POSTGRES_DB:-oftallearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: insoft-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-oftallearn}:${POSTGRES_PASSWORD:-oftallearn}@db:5432/${POSTGRES_DB:-oftallearn}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://0.0.0.0:3000}
      TEACHER_EMAILS: ${TEACHER_EMAILS:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_NORMALIZE_MODEL: ${OPENROUTER_NORMALIZE_MODEL:-liquid/lfm-2.5-2.6b:free}
      OPENROUTER_ANSWER_MODEL: ${OPENROUTER_ANSWER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      AI_ASK_RATE_LIMIT: ${AI_ASK_RATE_LIMIT:-60/hour}
      OPENROUTER_GLOBAL_LIMIT_PER_MIN: ${OPENROUTER_GLOBAL_LIMIT_PER_MIN:-18}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_QUESTION_RATE_LIMIT: ${AI_QUESTION_RATE_LIMIT:-5/hour}
      AI_QUESTION_MAX_ATTEMPTS: ${AI_QUESTION_MAX_ATTEMPTS:-2}
      QUIZ_MAX_QUESTIONS: ${QUIZ_MAX_QUESTIONS:-10}
      QUIZ_ANSWER_RATE_LIMIT: ${QUIZ_ANSWER_RATE_LIMIT:-120/hour}
      PRACTICE_RATE_LIMIT: ${PRACTICE_RATE_LIMIT:-30/hour}
      PRACTICE_DEFAULT_COUNT: ${PRACTICE_DEFAULT_COUNT:-5}
      PRACTICE_MAX_COUNT: ${PRACTICE_MAX_COUNT:-10}
      PRACTICE_AI_RATIO: ${PRACTICE_AI_RATIO:-0.4}
      PRACTICE_MAX_GENERATIONS_PER_SUBTOPIC_PER_DAY: ${PRACTICE_MAX_GENERATIONS_PER_SUBTOPIC_PER_DAY:-4}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_ENABLE_DEV_LOGIN: ${DEV_AUTH_ENABLED:-false}
    container_name: insoft-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
