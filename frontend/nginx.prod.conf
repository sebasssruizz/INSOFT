# Nginx de producción para el frontend estático de INSOFT.
# Se ejecuta SIN privilegios: escucha en 8080 (el proxy inverso Caddy es el
# único que publica 80/443) y usa /tmp para pid y temporales.
# Se instala como /etc/nginx/nginx.conf (config principal completa).

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # Temporales en /tmp (usuario no-root)
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad básicas
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA: cualquier ruta la resuelve React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html nunca en caché (cargó los assets con hash nuevos)
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }

        # Assets con hash: caché larga (incluye modelos 3D .glb y fuentes)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|glb|gltf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
