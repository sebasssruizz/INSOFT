; pgbouncer del ensayo: agrupadora en modo transacción con TLS obligatorio en
; ambos lados (cliente→pgbouncer y pgbouncer→postgres), como el pooler de Neon.
[databases]
ensayo = host=tmp-ensayo-pg port=5432 dbname=ensayo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
; el cliente DEBE usar TLS: una conexión sin cifrar se rechaza
client_tls_sslmode = require
client_tls_cert_file = /tmp/server.crt
client_tls_key_file = /tmp/server.key
server_tls_sslmode = require
ignore_startup_parameters = extra_float_digits
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
