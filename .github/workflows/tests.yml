name: pruebas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDINGS_BACKEND: onnx
      EMBEDDINGS_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: insoft_tmp_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U audit -d insoft_tmp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-onnx.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-onnx.txt -r backend/requirements-dev.txt
      - name: Suite aislada SQLite y proveedores simulados
        run: python -m pytest tests -q
        working-directory: backend
      - name: Migraciones PostgreSQL con pgvector (base desechable)
        run: python -m pytest tests/test_migraciones_pg.py -q
        working-directory: backend
        env:
          MIGRACIONES_PG_URL: postgresql+psycopg2://audit:ci-disposable-only@localhost:5432/insoft_tmp_ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Solo validación CI; no es un destino real ni un bundle publicable.
          VITE_API_URL: https://api.insoft.example.invalid

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: insoft-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
