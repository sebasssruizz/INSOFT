name: publicar-backend

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publicar-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.CLOUD_RUN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: insoft-backend
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validar configuración
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$PROVIDER"
          test -n "$DEPLOYER"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Autenticar registro de imágenes
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/insoft/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Actualizar servicio existente sin sustituir secretos
        run: |
          set -eu
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)'
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/insoft/backend:${IMAGE_TAG}" \
            --cpu 1 --memory 2Gi --concurrency 4 \
            --min 0 --max 1 --min-instances 0 --max-instances 1 \
            --cpu-throttling --timeout 120 --port 8000 --quiet
      - name: Verificar readiness público
        run: |
          set -eu
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 120 "${SERVICE_URL}/ready"
